name: Build macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-26
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Test and package release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: sh scripts/release.sh "$RELEASE_TAG"
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/releases/$RELEASE_TAG/YooTrack-$RELEASE_TAG-macos-arm64.dmg" \
            "build/releases/$RELEASE_TAG/YooTrack-$RELEASE_TAG-macos-arm64.zip" \
            "build/releases/$RELEASE_TAG/SHA256SUMS.txt" \
            --clobber
